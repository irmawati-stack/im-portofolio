<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <div>
        Create Account
    </div>

    <div>
        <label for="firstname">First name </label>
        <input type="text" id="firstname" placeholder="enter your first name">
    </div>

        <div class="form-group">
                    <label for="lastname">Last name</label>
                    <input type="text" id="lastname" placeholder="enter your last name">
        </div>

        <div>
            <label for="email">Email*</label>
            <input type="text" id="email" placeholder="enter your email">
        </div>

        <div>
            <label for="password">Password*</label>
            <input type="password" id="password" placeholder="enter your password">
            <div>
                <label for="confirm">Confirm Password*</label>
                <input type="password" id="password" placeholder="enter your password again">
            </div>
        </div>

        <div>
            <label for="gender">Gender: </label>
            <input type="radio" name="gender" value="male">
            <label>Male</label>
            <input type="radio" name="gender" value="female"> 
            <label>Female</label>
            <div>
                <label for="hobi">Hobbies</label>
                <input type="checkbox" name="hobi" value="music">Music
                <input type="checkbox" name="hobi" value="sports">Sports
                <input type="checkbox" name="hobi" value="travel">Travel
                <input type="checkbox" name="hobi" value="movies">Movies
            </div>
        </div>

        <div>
            <label for="source of income">Source of Income</label>
            <tr>
                    
                    <td class="field">
                        <select id="course" name="course" class="course-select">
                            <option value="">Employed</option>
                            <option value="btech">B.Tech</option>
                            
                        </select>
                        <div><label for="income">Income</label>
                            <br>
                        <input type="range" name="income" ></div>
                        <output>o</output>
                        
                    </td>
                </tr>
        </div>
    </div>
    
</body>
</html>
