<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#">
        <table>
            <tr>
                <td class="label"><label for="rollno">Roll no. :</label></td>
                <td class="field">
                <input type="text" id="rollno" name="rollno" class="full-width">
                </td>
            </tr>
            
            <tr>
                <td class="label"><label for="firstname">Student name :</label></td>
                 <td class="field">
                    <input type="text" id="firstname" name="firstname" placeholder="First Name" class="name-input">
                     <span class="separator">-</span>
                    <input type="text" id="lastname" name="lastname" placeholder="Last Name" class="name-input">
                </td>
             </tr>
            <tr>
                    <td class="label"><label for="fathername">Father's name :</label></td>
                    <td class="field">
                        <input type="text" id="fathername" name="fathername" class="full-width">
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="dob_day">Date of birth :</label></td>
                    <td class="field">
                        <input type="text" id="dob_day" name="dob_day" placeholder="Day" class="dob-day">
                        <span class="separator">-</span>
                        <input type="text" id="dob_month" name="dob_month" placeholder="Month" class="dob-month">
                        <span class="separator">-</span>
                        <input type="text" id="dob_year" name="dob_year" placeholder="Year" class="dob-year">
                        <span class="dob-format">(DD-MM-YYYY)</span>
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="mobile">Mobile no. :</label></td>
                    <td class="field">
                        <input type="text" id="mobile_prefix" name="mobile_prefix" value="+91" class="mobile-code">
                        <span class="separator">-</span>
                        <input type="text" id="mobile" name="mobile" class="mobile-number">
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="email">Email id :</label></td>
                    <td class="field">
                        <input type="text" id="email" name="email" class="full-width">
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="password">Password :</label></td>
                    <td class="field">
                        <input type="password" id="password" name="password" class="full-width">
                    </td>
                </tr>
                <tr>
                    <td class="label">Gender :</td>
                    <td class="field">
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male"> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">Department :</td>
                    <td class="field">
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="department" value="CSE"> CSE</label>
                            <label><input type="checkbox" name="department" value="IT"> IT</label>
                            <label><input type="checkbox" name="department" value="ECE"> ECE</label>
                            <label><input type="checkbox" name="department" value="Civil"> Civil</label>
                            <label><input type="checkbox" name="department" value="Mech"> Mech</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="course">Course :</label></td>
                    <td class="field">
                        <select id="course" name="course" class="course-select">
                            <option value="">-------------------- Select Current Course's --------------------</option>
                            <option value="btech">B.Tech</option>
                            <option value="mtech">M.Tech</option>
                            <option value="bca">BCA</option>
                            <option value="mca">MCA</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="photo">Student photo :</label></td>
                    <td class="field">
                        <input type="file" id="photo" name="photo">
                    </td>
                </tr>

                
                <tr>
                    <td class="label"><label for="city">City :</label></td>
                    <td class="field">
                        <input type="text" id="city" name="city" class="full-width">
                    </td>
                </tr>
                <tr>
                    <td class="label" style="vertical-align: top; padding-top: 5px;"><label for="address">Address :</label></td>
                    <td class="field">
                        <textarea id="address" name="address"></textarea>
                    </td>
                </tr>
            </table>

            <!-- Submit Button -->
            <div class="submit-container">
                <button type="submit" class="btn-submit">Register</button>
            </div>
        
        </table>
    </form>
</body>
</html>
